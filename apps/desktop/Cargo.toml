[package]
name = "lokus-desktop"
description = "Lokus desktop shell: a window around lokus-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "lokus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
lokus-ai = { path = "../../crates/lokus-ai" }
lokus-core = { path = "../../crates/lokus-core" }
lokus-sync = { path = "../../crates/lokus-sync" }
open = "5"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
url = "2"
tokio.workspace = true

# Dev builds use these to ask the web view for a picture of itself.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
