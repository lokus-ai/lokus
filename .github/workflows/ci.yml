# Throwaway: a published copy of one version updates itself to the next. Never merged.
name: CI
on:
  workflow_dispatch:
    inputs:
      from:
        default: 2.0.0-alpha.10
      to:
        default: 2.0.0-alpha.11
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the published copy and let it update itself
        run: |
          set -e
          mkdir -p out
          curl -fsSL -o old-setup.exe "https://github.com/lokus-ai/lokus/releases/download/v$FROM/Lokus_${FROM}_x64-setup.exe"
          sha256sum old-setup.exe | tee out/old-setup.sha256
          cmd //c "$(cygpath -w old-setup.exe) /S"
          APP=$(ls "$LOCALAPPDATA"/Lokus/*.exe | grep -vi uninstall | head -1)
          echo "installed: $APP"
          powershell -Command "(Get-Item '$(cygpath -w "$APP")').VersionInfo | Format-List ProductVersion,FileVersion" | tee out/version-before.txt
          sha256sum "$APP" | tee out/exe-before.sha256
          reg add "HKCU\\Software\\Policies\\Microsoft\\Edge\\WebView2\\AdditionalBrowserArguments" //v "lokus-desktop.exe" //t REG_SZ //d "--remote-debugging-port=9222" //f || true
          "$APP" > out/app.log 2>&1 &
          sleep 10
          curl -s -m 5 http://127.0.0.1:9222/json/version || echo "the window cannot be asked directly; using its buttons only"
          export APP_EXE="$(cygpath -w "$APP")"
          node proof/windows.mjs
          sleep 3
          powershell -Command "(Get-Item '$(cygpath -w "$APP")').VersionInfo | Format-List ProductVersion,FileVersion" | tee out/version-after.txt
          sha256sum "$APP" | tee out/exe-after.sha256
          powershell -Command "Get-Process | Where-Object { \$_.Path -like '*Lokus*' } | Format-Table Id,StartTime,Path -AutoSize" | tee out/processes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfupdate-windows
          path: out/
  linux:
    runs-on: ubuntu-22.04
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: What the app needs to run, a screen, and eyes
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 dbus xvfb imagemagick xdg-utils libfuse2 file xdotool tesseract-ocr
      - name: Open the published copy and let it update itself
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" bash proof/linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfupdate-linux
          path: out/
