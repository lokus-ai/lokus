name: CI

# Minutes are limited: this runs for pull requests and on demand, not on
# every push. Run the same steps locally first (see CONTRIBUTING.md).
on:
  pull_request:
    branches: [next, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: node checks/run.mjs

  # Lokus on Windows and on Linux: the tests, then the real app started and used through its
  # dev channel (a folder, notes, and a team folder kept in step with a teammate through a
  # relay started on the runner). The pictures are kept. It takes about fifteen minutes, so it
  # runs when asked for (Actions, CI, Run workflow), on a pull request labelled "desktop", and
  # on every pull request into main (that is a release), not on every push.
  #
  # What people would download (the Windows installer, the Linux AppImage) is built, installed
  # and opened here only on a run by hand (Run workflow). A release does the same with the
  # real files before it puts anything out, so doing it on the pull request too was twelve
  # minutes spent twice.
  desktop:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'desktop')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # Linux has no screen on a runner, so the app gets a pretend one.
          - os: ubuntu-22.04
            run: dbus-run-session -- xvfb-run -a
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      # A runner has no graphics card; WebKit on Linux draws nothing without these.
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      RUN: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries and a screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev dbus xvfb imagemagick xdg-utils libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - name: Build the app with its dev channel
        run: pnpm tauri build --debug --no-bundle
        env:
          VITE_LOKUS_DEV_CHANNEL: "1"
      - run: cargo build -p lokus-cli -p lokus-server
      - name: Start Lokus and use it, alone and in a team
        run: $RUN node checks/desktop-smoke.mjs
      # The way a release builds it (deploy/release/desktop.sh), signed with a key made for
      # this run and thrown away with it; the real one is only in the release environment.
      # The version is shaped like the ones that go out (2.0.0-alpha.9), file names and all.
      - name: Build what people would download
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          pnpm tauri signer generate --ci -w "$RUNNER_TEMP/throwaway.key" >/dev/null
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway.key")" sh deploy/release/desktop.sh 0.0.1-alpha.1 https://relay.lokusmd.com
      - name: Install it and open it (Windows)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: |
          set -e
          cmd //c "$(cygpath -w dist-release/0.0.1-alpha.1/Lokus_0.0.1-alpha.1_x64-setup.exe) /S"
          APP=$(ls "$LOCALAPPDATA"/Lokus/*.exe | grep -vi uninstall | head -1)
          echo "installed: $APP"
          node checks/desktop-smoke.mjs "$APP"
      - name: Open it (Linux)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: |
          set -e
          chmod +x dist-release/0.0.1-alpha.1/*.AppImage
          $RUN node checks/desktop-smoke.mjs "$PWD/dist-release/0.0.1-alpha.1/Lokus_0.0.1-alpha.1_amd64.AppImage" --appimage-extract-and-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ runner.os }}
          path: desktop-smoke/
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: lokus-installer-${{ runner.os }}
          path: dist-release/0.0.1-alpha.1/
