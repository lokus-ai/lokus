name: Release

# Builds Lokus for both kinds of Mac, signed and notarized, and puts it out: the files on a
# GitHub pre-release, the news post, and the word to every installed copy that there is a new
# version. The same script a person runs on their own Mac (deploy/release/mac.sh) does the
# building; this only puts the keys in place around it.
#
#   Actions, Release, Run workflow: choose the branch, type the version.
#   Or: gh workflow run release.yml --ref next -f version=2.0.0-alpha.7
#
# With "publish" off it builds and keeps the files as a download on the run, and tells nobody.
#
# It stays a PRE-release and never writes `latest.json`: Lokus 1 updates itself from this
# repository's "latest" release, and would move every Lokus 1 user onto Lokus 2.
#
# Secrets it uses (Settings, Secrets and variables, Actions):
#   LOKUS_UPDATER_KEY         signs update files; installed copies trust only this key
#   LOKUS_PUBLISH_KEY         lets `lokus release` and `lokus news` tell the relay
#   APPLE_CERTIFICATE (+ _PASSWORD)   the Developer ID certificate, as a base64 .p12
#   LOKUS_APPLE_API_KEY_P8, LOKUS_APPLE_API_KEY_ID, LOKUS_APPLE_API_ISSUER   notarization
#   VITE_POSTHOG_KEY, VITE_POSTHOG_HOST   usage counting, as in builds made by hand
# Variables: LOKUS_RELAY, LOKUS_SUPABASE_URL, LOKUS_SUPABASE_KEY (all public values).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 2.0.0-alpha.7"
        required: true
      publish:
        description: "Put it out: GitHub pre-release, news, and tell installed copies to update"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    name: Mac (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        arch: [aarch64, x86_64]
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Put the keys in place
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          UPDATER_KEY: ${{ secrets.LOKUS_UPDATER_KEY }}
          API_KEY_P8: ${{ secrets.LOKUS_APPLE_API_KEY_P8 }}
        run: |
          set -e
          [ -n "$CERT" ] && [ -n "$UPDATER_KEY" ] && [ -n "$API_KEY_P8" ] || { echo "a secret this needs is not set; see the top of release.yml"; exit 1; }
          # The certificate goes into a keychain made for this run and thrown away with it.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASS=$(uuidgen)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" || { echo "the certificate in APPLE_CERTIFICATE is not a Developer ID Application one"; exit 1; }
          mkdir -p "$HOME/.lokus-release"
          printf '%s' "$UPDATER_KEY" > "$HOME/.lokus-release/updater.key"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.LOKUS_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.LOKUS_APPLE_API_ISSUER }}
          LOKUS_MUST_NOTARIZE: "1"
          LOKUS_RUST: stable
          VITE_SUPABASE_URL: ${{ vars.LOKUS_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.LOKUS_SUPABASE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: sh deploy/release/mac.sh "${{ inputs.version }}" "${{ vars.LOKUS_RELAY }}" "${{ matrix.arch }}"
      - name: Check what was built
        run: |
          set -e
          cd "dist-release/${{ inputs.version }}"
          ls -la
          spctl -a -t open --context context:primary-signature -vv "Lokus_${{ inputs.version }}_${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: lokus-${{ inputs.version }}-${{ matrix.arch }}
          path: dist-release/${{ inputs.version }}/Lokus_*
          if-no-files-found: error

  publish:
    name: Put it out
    needs: mac
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      RELAY: ${{ vars.LOKUS_RELAY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOKUS_PUBLISH_KEY: ${{ secrets.LOKUS_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true
      - name: What the command-line tool needs to build on Linux
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lokus-cli
      - name: The files, on a GitHub pre-release
        run: |
          set -e
          ls -la built
          gh release create "v$VERSION" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Lokus $VERSION" \
            --notes "Early build for Macs. Open the .dmg and drag Lokus into Applications. Copies already installed update themselves." \
            built/Lokus_*
      - name: The news post, if this version has one
        run: |
          POST="news/$(echo "$VERSION" | tr '.' '-').md"
          if [ -f "$POST" ]; then ./target/release/lokus news "file=$POST" "server=$RELAY"; else echo "no $POST; nothing to post"; fi
      - name: Tell installed copies
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          ./target/release/lokus release "version=$VERSION" "server=$RELAY" \
            "darwin-aarch64=$BASE/Lokus_aarch64.app.tar.gz" \
            "darwin-x86_64=$BASE/Lokus_x86_64.app.tar.gz"
