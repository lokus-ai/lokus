name: Release build

# Manual only. Builds the desktop app with signed update files and attaches them to a GitHub
# PRE-release. It does not tell anyone's app to update: that is `lokus release`, run by a
# person afterwards (docs/releasing.md).
#
# It must stay a pre-release with no `latest.json`: Lokus 1 updates itself from this
# repository's "latest" release, and would move every Lokus 1 user onto this build.
#
# Not yet run in CI. Needs these secrets: TAURI_SIGNING_PRIVATE_KEY (and its password if it has
# one), and for a Mac build people can open, the APPLE_* signing and notarization secrets.
# Needs the repository variable LOKUS_UPDATES (the relay's https address).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, like 2.0.0-alpha.1"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin", rust: aarch64-apple-darwin }
          - { os: macos-latest, args: "--target x86_64-apple-darwin", rust: x86_64-apple-darwin }
          - { os: windows-latest, args: "", rust: "" }
          - { os: ubuntu-22.04, args: "", rust: "" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_LOKUS_UPDATES: ${{ vars.LOKUS_UPDATES }}
          VITE_LOKUS_RELAY: ${{ vars.LOKUS_UPDATES }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: Lokus ${{ inputs.version }}
          releaseBody: "Pre-release build. See docs/releasing.md."
          prerelease: true
          releaseDraft: false
          includeUpdaterJson: false
          args: >-
            ${{ matrix.args }}
            --config apps/desktop/release.conf.json
            --config {"version":"${{ inputs.version }}"}
