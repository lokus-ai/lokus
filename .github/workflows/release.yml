name: Release

# A version goes out when a pull request is merged into main, and at no other time.
#
# To release: in the pull request, change the one line in the file VERSION (and, if you like,
# add news/<version with dashes>.md). When it is merged, this builds Lokus for both kinds of
# Mac (signed and notarized), for Windows and for Linux, and puts it out: the files on a
# GitHub pre-release, the news post, and the word to every installed copy that there is a new
# version. A merge that leaves VERSION alone releases nothing.
#
# Who can release is therefore who can merge into main. The keys live in the "release"
# environment, which only a run on main may use: a workflow on any other branch, or in a pull
# request from a fork, cannot read them, whatever it is edited to say.
#
# It stays a PRE-release and never writes `latest.json`: Lokus 1 updates itself from this
# repository's "latest" release, and would move every Lokus 1 user onto Lokus 2.
#
# The building is done by the scripts a person can also run on their own computer
# (deploy/release/mac.sh, and desktop.sh for Windows and Linux); this only puts the keys in
# place around them. The Windows installer carries no Windows certificate, so Windows asks
# before running it.
#
# In the "release" environment: LOKUS_UPDATER_KEY (signs update files; installed copies trust
# only this key), LOKUS_PUBLISH_KEY (lets the relay be told), LOKUS_APPLE_API_KEY_P8,
# LOKUS_APPLE_API_KEY_ID, LOKUS_APPLE_API_ISSUER (notarization). Repository secrets:
# APPLE_CERTIFICATE and its password (the Developer ID certificate, a base64 .p12),
# VITE_POSTHOG_KEY, VITE_POSTHOG_HOST. Variables: LOKUS_RELAY, LOKUS_SUPABASE_URL,
# LOKUS_SUPABASE_KEY (all public values).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    name: Is there a version to put out?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(tr -d ' \n\r' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "VERSION holds \"$VERSION\", which is not a version like 2.0.1"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Out already: this merge changed something else, and there is nothing to release.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION is already out; nothing to do"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "releasing v$VERSION"
          fi

  mac:
    name: Mac (${{ matrix.arch }})
    needs: decide
    if: needs.decide.outputs.release == 'true'
    environment: release
    strategy:
      fail-fast: true
      matrix:
        arch: [aarch64, x86_64]
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Put the keys in place
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          UPDATER_KEY: ${{ secrets.LOKUS_UPDATER_KEY }}
          API_KEY_P8: ${{ secrets.LOKUS_APPLE_API_KEY_P8 }}
        run: |
          set -e
          [ -n "$CERT" ] && [ -n "$UPDATER_KEY" ] && [ -n "$API_KEY_P8" ] || { echo "a secret this needs is not set; see the top of release.yml"; exit 1; }
          # The certificate goes into a keychain made for this run and thrown away with it.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASS=$(uuidgen)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" || { echo "the certificate in APPLE_CERTIFICATE is not a Developer ID Application one"; exit 1; }
          mkdir -p "$HOME/.lokus-release"
          printf '%s' "$UPDATER_KEY" > "$HOME/.lokus-release/updater.key"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.LOKUS_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.LOKUS_APPLE_API_ISSUER }}
          LOKUS_MUST_NOTARIZE: "1"
          LOKUS_RUST: stable
          VITE_SUPABASE_URL: ${{ vars.LOKUS_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.LOKUS_SUPABASE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: sh deploy/release/mac.sh "${{ needs.decide.outputs.version }}" "${{ vars.LOKUS_RELAY }}" "${{ matrix.arch }}"
      - name: Check what was built
        run: |
          set -e
          cd "dist-release/${{ needs.decide.outputs.version }}"
          ls -la
          spctl -a -t open --context context:primary-signature -vv "Lokus_${{ needs.decide.outputs.version }}_${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: lokus-${{ needs.decide.outputs.version }}-${{ matrix.arch }}
          path: dist-release/${{ needs.decide.outputs.version }}/Lokus_*
          if-no-files-found: error

  # Windows and Linux. No certificate: only the update file is signed, with our own key.
  desktop:
    name: ${{ matrix.name }}
    needs: decide
    if: needs.decide.outputs.release == 'true'
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # The oldest Ubuntu still offered, so the AppImage opens on older Linux too.
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev dbus xvfb imagemagick xdg-utils libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and sign the update file
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LOKUS_UPDATER_KEY }}
          VITE_SUPABASE_URL: ${{ vars.LOKUS_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.LOKUS_SUPABASE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: sh deploy/release/desktop.sh "${{ needs.decide.outputs.version }}" "${{ vars.LOKUS_RELAY }}"
      # The very file people will download is installed and opened here first. One that does
      # not stay open stops the release.
      - name: Install it and open it (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -e
          cmd //c "$(cygpath -w "dist-release/$VERSION/Lokus_${VERSION}_x64-setup.exe") /S"
          APP=$(ls "$LOCALAPPDATA"/Lokus/*.exe | grep -vi uninstall | head -1)
          node checks/desktop-smoke.mjs "$APP"
      - name: Open it (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          # A runner has no graphics card; WebKit on Linux draws nothing without these.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set -e
          chmod +x "dist-release/$VERSION/Lokus_${VERSION}_amd64.AppImage"
          dbus-run-session -- xvfb-run -a node checks/desktop-smoke.mjs "$PWD/dist-release/$VERSION/Lokus_${VERSION}_amd64.AppImage" --appimage-extract-and-run
      - uses: actions/upload-artifact@v4
        with:
          name: lokus-${{ needs.decide.outputs.version }}-${{ matrix.name }}
          path: dist-release/${{ needs.decide.outputs.version }}/Lokus_*
          if-no-files-found: error

  publish:
    name: Put it out
    needs: [decide, mac, desktop]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      RELAY: ${{ vars.LOKUS_RELAY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOKUS_PUBLISH_KEY: ${{ secrets.LOKUS_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true
      - name: What the command-line tool needs to build on Linux
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lokus-cli
      - name: The files, on a GitHub pre-release
        run: |
          set -e
          ls -la built
          gh release create "v$VERSION" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Lokus $VERSION" \
            --notes "Early build. Mac: open the .dmg and drag Lokus into Applications. Windows: run the -setup.exe; Windows asks first, choose More info, then Run anyway. Linux: make the .AppImage runnable (chmod +x) and open it. Copies already installed update themselves." \
            built/Lokus_*
      - name: The news post, if this version has one
        run: |
          POST="news/$(echo "$VERSION" | tr '.' '-').md"
          if [ -f "$POST" ]; then ./target/release/lokus news "file=$POST" "server=$RELAY"; else echo "no $POST; nothing to post"; fi
      - name: Tell installed copies
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          ./target/release/lokus release "version=$VERSION" "server=$RELAY" \
            "darwin-aarch64=$BASE/Lokus_aarch64.app.tar.gz" \
            "darwin-x86_64=$BASE/Lokus_x86_64.app.tar.gz" \
            "windows-x86_64=$BASE/Lokus_${VERSION}_x64-setup.exe" \
            "linux-x86_64=$BASE/Lokus_${VERSION}_amd64.AppImage"
