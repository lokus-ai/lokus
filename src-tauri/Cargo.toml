[package]
name = "lokus"
version = "1.2.0"
description = "Lokus - Modern Knowledge Management and Writing Platform"
authors = ["you"]
license = "LicenseRef-FCL-1.0-MIT"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lokus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.0", features = [] }

[dependencies]
# Tauri crate versions are pinned to a MINOR here, and the matching npm
# packages are pinned with `~` in package.json.
#
# `tauri build` refuses to run when a crate and its npm package differ on
# major.minor. Cargo.lock is gitignored, so CI resolves these from scratch:
# a caret range let the Rust side float to a newer minor than the npm side had
# resolved to (or the reverse), and the release build failed on the mismatch.
# Pinning both sides means CI and a local checkout resolve the same versions.
# Note the tilde: in Cargo a bare "2.10" means ^2.10 and still accepts
# 2.11, which is exactly how this slipped through the first time.
# Keep `tauri` on the same minor as tauri-runtime/tauri-runtime-wry, which
# it depends on with a caret: pinning the core to ~2.10 while the runtime
# resolved to 2.11 produced a trait-bound error *inside* the tauri crate.
# Bump them together, deliberately.
tauri = { version = "~2.11", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Kept in lockstep with @tauri-apps/plugin-dialog in package.json.
# `tauri build` refuses to run when the crate and the npm package differ
# on major.minor, and a caret range on the npm side used to float ahead
# of this pin on a clean CI install and break the release.
tauri-plugin-dialog = "~2.7"
tauri-plugin-fs = "~2.5"
urlencoding = "2.1.3"
tauri-plugin-store = "~2.4"
tauri-plugin-clipboard-manager = "~2.3"
tauri-plugin-updater = "~2.10"
tokio = { version = "1", features = ["full"] }
regex = "1.0"
walkdir = "2.0"
# Native FS watching (FSEvents on macOS) for the workspace watcher
notify = "6.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
url = "2.5"
tempfile = "3.8"
zip = "2.4"
sha2 = "0.10"
semver = "1.0"
num_cpus = "1.0"
tauri-plugin-deep-link = "~2.4"
pkce = "0.2"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "v5", "v7"] }
tokio-util = "0.7"
dotenvy = "0.15"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
http-body-util = "0.1"
tower = "0.4"
tower-service = "0.3"
mime = "0.3"
flate2 = "1.0"
async-trait = "0.1"
futures = "0.3"
once_cell = "1.19"
parking_lot = "0.12"
bincode = "1.3"
thiserror = "2.0"
lazy_static = "1.4"
# Logging infrastructure
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time"] }
tracing-appender = "0.2"
tauri-plugin-shell = "~2.3"
blake3 = "1.5"
getrandom = "0.2"
rrule = "0.14.0"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
rusqlite = { version = "0.32", features = ["bundled"] }

# Desktop-only dependencies (use system_configuration which is macOS-only)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
machine-uid = "0.4"
tauri-plugin-global-shortcut = "~2.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
keyring = "3.6"
oauth2 = "4.4"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
# Gmail integration dependencies
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
mail-parser = "0.9"
mailparse = "0.15"
quoted_printable = "0.5"
# iCal parsing
ical = "0.11"
axum = "0.7"
# Crash reporting
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "rustls", "reqwest"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
objc-foundation = "0.1"
security-framework = "2.9"
# Native macOS APIs (notifications, app detection)
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError", "NSUUID", "NSSet", "NSBundle"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationResponse",
    "UNNotification",
    "UNNotificationTrigger",
    "UNNotificationSettings",
    "block2",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.57", features = ["Win32_Security_Credentials"] }

# Linux uses keyring crate (already in main deps) which handles secret-service internally

# Dependencies are compiled once and then cached, so paying for opt-level 2 on
# them costs a single slow build and makes every dev run 30-65x faster in the
# hot paths (serde, flate2, regex). Our own crate stays at opt-level 0 so
# incremental rebuilds remain fast.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# `panic = "abort"` is deliberately NOT set: it only changes anything at link
# time, so it can't be validated without a full release build, and the size it
# saves isn't worth shipping an unvalidated panic strategy.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
