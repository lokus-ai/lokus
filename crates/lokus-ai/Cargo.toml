[package]
name = "lokus-ai"
description = "The assistant: provider calls with the user's own key, vault tools and MCP tool servers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
lokus-core = { path = "../lokus-core" }
futures-util.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "3", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
