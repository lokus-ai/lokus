<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; user-select: none;
  }
  .dial {
    position: relative; width: 150px; height: 150px; border-radius: 50%;
    border: 3px solid #8b93a7;
    background: radial-gradient(circle at 35% 30%, #2b3040, #171a23);
    box-shadow: 0 6px 24px rgba(0,0,0,.35), inset 0 0 12px rgba(0,0,0,.5);
  }
  .hand {
    position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%;
    border-radius: 4px;
  }
  .hour   { width: 5px; height: 38px; background: #e8ebf2; margin-left: -2.5px; }
  .minute { width: 3px; height: 54px; background: #aeb6c8; margin-left: -1.5px; }
  .second { width: 1.5px; height: 62px; background: #ff6b6b; margin-left: -0.75px; }
  .pin {
    position: absolute; left: 50%; top: 50%; width: 9px; height: 9px;
    margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #ff6b6b;
  }
  .digital { font-size: 26px; font-weight: 600; color: #e8ebf2; letter-spacing: 2px; }
  .date { font-size: 12px; color: #8b93a7; }
  .tick-marks span {
    position: absolute; left: 50%; top: 6px; width: 2px; height: 8px;
    background: #5b6275; transform-origin: 50% 69px; margin-left: -1px;
  }
</style>
</head>
<body>
  <div class="dial">
    <div class="tick-marks" id="marks"></div>
    <div class="hand hour" id="h"></div>
    <div class="hand minute" id="m"></div>
    <div class="hand second" id="s"></div>
    <div class="pin"></div>
  </div>
  <div class="digital" id="digital">--:--:--</div>
  <div class="date" id="date"></div>

<script>
  const marks = document.getElementById('marks');
  for (let i = 0; i < 12; i++) {
    const t = document.createElement('span');
    t.style.transform = `rotate(${i * 30}deg)`;
    marks.appendChild(t);
  }

  function render() {
    const d = new Date();
    const s = d.getSeconds(), m = d.getMinutes(), h = d.getHours() % 12;
    document.getElementById('s').style.transform = `rotate(${s * 6}deg)`;
    document.getElementById('m').style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
    document.getElementById('h').style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
    const pad = (n) => String(n).padStart(2, '0');
    document.getElementById('digital').textContent =
      `${pad(d.getHours())}:${pad(m)}:${pad(s)}`;
    document.getElementById('date').textContent = d.toDateString();
  }
  render();
  setInterval(render, 250);
</script>
</body>
</html>
