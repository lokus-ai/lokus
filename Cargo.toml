[workspace]
resolver = "2"
members = ["crates/lokus-core", "crates/lokus-cli", "apps/desktop"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
